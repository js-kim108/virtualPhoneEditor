<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Phone Peek</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="story">
    <h1 id="story-title"></h1>
    <article id="story-body"></article>
  </main>
 
  <div class="overlay" id="overlay" hidden>
    <button class="close" id="close" type="button" aria-label="Close phone">✕</button>
    <div class="phone" role="dialog" aria-modal="true" aria-label="Phone">
      <span class="btn mute"></span><span class="btn vup"></span><span class="btn vdn"></span><span class="btn pwr"></span>
      <div class="bezel">
        <div class="display" id="display">
          <div class="status" id="status"></div>
          <div class="screen" id="screen"></div>
          <button class="homebar" id="homebar" type="button" aria-label="Home screen"></button>
        </div>
      </div>
    </div>
  </div>
 
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
